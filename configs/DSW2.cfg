
! device: localhost (vEOS-lab, EOS-4.35.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
snmp-server engineID local f5717f0cc5799cc58600
snmp-server view zabbixtest iso included
snmp-server group zabbixgroup v3 priv read zabbixtest write zabbixtest
snmp-server user zabbixuser zabbixgroup v3 localized f5717f0cc5799cc58600 auth sha224 2fc93835ccbe41b91c4140f1fc903bd1b30d321103ed1f0bdc406852 priv aes192 2fc93835ccbe41b91c4140f1fc903bd1b30d321103ed1f0b
snmp-server enable traps
!
spanning-tree mode mstp
spanning-tree mst 1 priority 4096
spanning-tree mst 2 priority 8192
!
spanning-tree mst configuration
   name vlan
   revision 1
   instance 1 vlan  20,60
   instance 2 vlan  10
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10,20,60
!
interface Port-Channel1
!
interface Ethernet1
   no switchport
   ip address 10.10.8.38/30
!
interface Ethernet2
   no switchport
   ip address 10.10.8.58/30
   ip ospf cost 100
!
interface Ethernet3
   channel-group 1 mode active
!
interface Ethernet4
   channel-group 1 mode active
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   switchport trunk allowed vlan 20,60
   switchport mode trunk
!
interface Ethernet12
   switchport trunk allowed vlan 10
   switchport mode trunk
!
interface Loopback1
   ip address 10.10.8.6/32
!
interface Management1
!
interface Vlan10
   ip address 10.10.10.253/24
   ip helper-address 10.10.8.13
   ip helper-address 10.10.8.17
   ip helper-address 10.10.8.21
   ip helper-address 10.10.8.25
!
interface Vlan20
   ip address 10.10.20.253/24
   ip helper-address 10.10.8.13
   ip helper-address 10.10.8.17
   ip helper-address 10.10.8.21
   ip helper-address 10.10.8.25
   vrrp 20 priority-level 110
   vrrp 20 ipv4 10.10.20.254
!
interface Vlan60
   ip address 10.10.60.253/24
   ip helper-address 10.0.8.25
   ip helper-address 10.10.8.13
   ip helper-address 10.10.8.17
   ip helper-address 10.10.8.21
   vrrp 60 priority-level 110
   vrrp 60 ipv4 10.10.60.254
!
ip routing
!
system control-plane
   ip access-group CONTROL-PLANE-ACL in
!
router ospf 6
   passive-interface Ethernet11
   passive-interface Ethernet12
   network 10.10.8.6/32 area 0.0.0.0
   network 10.10.8.36/30 area 0.0.0.0
   network 10.10.8.56/30 area 0.0.0.0
   network 10.10.20.0/24 area 0.0.0.0
   network 10.10.60.0/24 area 0.0.0.0
   max-lsa 12000
!
end
