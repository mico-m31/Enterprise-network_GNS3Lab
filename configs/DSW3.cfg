! device: localhost (vEOS-lab, EOS-4.35.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
snmp-server engineID local f5717f0cfd479d48b600
snmp-server view zabbixtest iso included
snmp-server group zabbixgroup v3 priv read zabbixtest write zabbixtest
snmp-server user zabbixuser zabbixgroup v3 localized f5717f0cfd479d48b600 auth sha224 84d9e185a8b55ad659c1f6aed0773f356e59a091bbacff4166851949 priv aes192 84d9e185a8b55ad659c1f6aed0773f356e59a091bbacff41
snmp-server enable traps
!
spanning-tree mode mstp
spanning-tree mst 1 priority 4096
spanning-tree mst 2 priority 8192
!
spanning-tree mst configuration
   name vlan
   revision 1
   instance 1 vlan  30
   instance 2 vlan  40
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 30,40
!
interface Port-Channel1
!
interface Ethernet1
   no switchport
   ip address 10.10.8.42/30
   ip ospf cost 100
!
interface Ethernet2
   no switchport
   ip address 10.10.8.54/30
   ip ospf cost 10
!
interface Ethernet3
   channel-group 1 mode active
!
interface Ethernet4
   channel-group 1 mode active
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   switchport trunk allowed vlan 40
   switchport mode trunk
!
interface Ethernet12
   switchport trunk allowed vlan 30
   switchport mode trunk
!
interface Loopback1
   ip address 10.10.8.7/32
!
interface Management1
!
interface Vlan30
   ip address 10.10.30.253/24
   ip helper-address 10.10.8.13
   ip helper-address 10.10.8.17
   ip helper-address 10.10.8.21
   ip helper-address 10.10.8.25
   ip ospf cost 10
   vrrp 30 priority-level 110
   vrrp 30 ipv4 10.10.30.254
!
interface Vlan40
   ip address 10.10.40.253/24
   ip helper-address 10.10.8.13
   ip helper-address 10.10.8.17
   ip helper-address 10.10.8.21
   ip helper-address 10.10.8.25
   ip ospf cost 10
   vrrp 40 ipv4 10.10.40.254
!
ip routing
!
system control-plane
   ip access-group CONTROL-PLANE-ACL in
!
router ospf 7
   passive-interface Ethernet11
   passive-interface Ethernet12
   network 10.10.8.7/32 area 0.0.0.0
   network 10.10.8.40/30 area 0.0.0.0
   network 10.10.8.52/30 area 0.0.0.0
   network 10.10.30.0/24 area 0.0.0.0
   network 10.10.40.0/24 area 0.0.0.0
   max-lsa 12000
!
end
